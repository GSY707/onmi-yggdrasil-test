[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-yggdrasil-v2-research"
version = "0.1.0"
description = "Project-Yggdrasil V2 architecture-fidelity experiments"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.5,<2",
  "safetensors>=0.4",
  "torch>=2.6",
  "transformers>=5.13.1,<6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
