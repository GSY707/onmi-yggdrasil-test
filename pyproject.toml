[project]
name = "latent-space-agent-feasibility"
version = "0.1.0"
description = "Feasibility probes for the Project Yggdrasil multimodal latent-space agent proposal."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=9.1,<10"]
docvqa = ["datasets>=5.0,<6", "numpy>=2.4,<3", "pillow>=12,<13"]
pretrained = ["transformers>=4.55,<5", "safetensors>=0.4,<1", "pillow>=12,<13", "huggingface-hub>=0.36,<1", "numpy>=2.4,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
